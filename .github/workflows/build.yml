name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release -DMYDAW_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run integration tests
        shell: bash
        run: |
          TESTS=$(find build/MyDAWTests_artefacts -type f \( -name "MyDAWTests" -o -name "MyDAWTests.exe" \) | head -n 1)
          echo "Running $TESTS"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$TESTS"; else "$TESTS"; fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows) cp build/MyDAW_artefacts/Release/myDAW.exe dist/ ;;
            macOS)   ditto -c -k --keepParent build/MyDAW_artefacts/Release/myDAW.app dist/myDAW-macOS.zip ;;
            Linux)   cp build/MyDAW_artefacts/Release/myDAW dist/ ;;
          esac
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: myDAW-${{ matrix.name }}
          path: dist/

  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS

      # Unsigned build for real iPhones / iPads. Sideloading tools (Sideloadly, AltStore, ...)
      # sign it with the user's own Apple ID when they install it.
      - name: Build
        run: |
          cmake --build build-ios --config Release --target MyDAW -- \
            -sdk iphoneos -quiet -jobs 4 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""

      - name: Package
        run: |
          APP=$(find build-ios -type d -name "myDAW.app" -path "*Release-iphoneos*" | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          plutil -p "$APP/Info.plist"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry myDAW-iOS-unsigned.ipa Payload && rm -rf Payload)
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: myDAW-iOS
          path: dist/
